services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: beyondwin_test
      POSTGRES_PASSWORD: beyondwin_test
      POSTGRES_DB: beyondwin_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beyondwin_test -d beyondwin_test"]
      interval: 1s
      timeout: 3s
      retries: 30
