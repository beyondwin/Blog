# Prepared Astro rollback route. Installation and traffic mutation require
# separate, direct production authorization for an exact host and release.
upstream beyondwin_public_astro_rollback {
    server 127.0.0.1:4392;
    keepalive 16;
}

server {
    listen 127.0.0.1:4389;
    server_name localhost;

    location / {
        proxy_pass http://beyondwin_public_astro_rollback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header X-Beyondwin-Renderer astro-rollback always;
    }
}
