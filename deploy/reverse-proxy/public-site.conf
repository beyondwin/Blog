# Prepared React public-site route. Installation and traffic mutation require
# separate, direct production authorization for an exact host and release.
upstream beyondwin_public_react {
    server 127.0.0.1:4391;
    keepalive 16;
}

upstream beyondwin_public_api {
    server 127.0.0.1:4392;
    keepalive 16;
}

server {
    listen 127.0.0.1:4389;
    server_name localhost;
    server_tokens off;

    location = /api/public/ask {
        if ($request_uri != "/api/public/ask") { return 404; }
        if ($request_method != POST) { return 405; }
        if ($http_host != "localhost:4389") { return 400; }
        if ($http_upgrade != "") { return 400; }

        client_max_body_size 4k;
        proxy_pass http://beyondwin_public_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 1s;
        proxy_send_timeout 12s;
        proxy_read_timeout 12s;
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1:4392;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:4389;
        proxy_set_header Connection "";

        proxy_hide_header Set-Cookie;
        proxy_hide_header Location;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Request-Headers;
        proxy_hide_header Access-Control-Request-Method;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Beyondwin-Forbidden-Sentinel;
        proxy_redirect off;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location = /health { return 404; }
    location ^~ /health/ { return 404; }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($http_host != "localhost:4389") { return 400; }
        if ($http_upgrade != "") { return 400; }
        proxy_pass http://beyondwin_public_react;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1:4391;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:4389;
        proxy_set_header Connection "";
        add_header X-Beyondwin-Renderer react always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
    }
}
