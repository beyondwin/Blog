recommendation:
  stack_id: 2
  rationale:
    - Only stack with no licensing or WOFF2 conversion hold across all three roles.
    - Cormorant wordmark is 18.86 percent narrower than Libre Baskerville at the fixed desktop role size and is closer to the approved reference silhouette.
    - Korean title preserves the same two-line wrap at desktop and mobile, with stable body color and no observed collision or horizontal overflow.
  selection_authority: delegated controller after independent visual review
selection:
  selected_stack_id: 2
  selected_stack: Noto Serif KR 400 + Cormorant Garamond 400 + Noto Sans KR 400
  decision: SELECT_STACK_2
