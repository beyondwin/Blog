version: 1
articles:
  - recordId: graphify-code-knowledge-graph-deep-dive
    decision: retain
    family: data-structure
    claim: Graphify는 코드 위치와 관계를 빠르게 탐색하게 하지만 그래프 산출물의 재현 조건과 신뢰 경계는 별도로 검증해야 한다.
    mustNotImply: 지식 그래프가 코드의 의미를 완전하게 이해하거나 정확성을 자동으로 보증한다고 보여서는 안 된다.
    action: 끊긴 경로의 양쪽 끝을 따라가며 연결 가능성을 점검한다.
    subject: 높이가 다른 구조 사이에서 멈춘 검은 연결 다리
    cameraDistance: wide
    focalPoint: [0.55, 0.62]
    safeArea: [0.08, 0.08, 0.92, 0.92]
    reason: 승인된 A03 원본은 실제 1536x1024 bytes와 sha256:2fb5b356f40608a602c620747dd96a27ae63f7cea6b3214c837d2abdff9fb625가 manifest와 일치하며, 끊긴 다리와 경로가 그래프 탐색의 가능성과 간극을 함께 드러내므로 유지한다.

  - recordId: agents-md-vs-agent-skills-evidence
    decision: replace
    family: boundary-evidence
    claim: 상시 적용되는 AGENTS.md와 필요할 때 호출되는 Skills는 경쟁 규칙이 아니라 서로 다른 범위와 시점을 맡는 지침 계층이다.
    mustNotImply: 어느 한 형식이 모든 작업에서 우월하거나 두 형식이 같은 실행 범위를 가진다고 보여서는 안 된다.
    action: 두 종류의 지침 카드를 서로 다른 보관 경계에 나누어 꽂는다.
    subject: 깊이와 색이 다른 지침 카드 두 장과 분리 보관함
    cameraDistance: close
    focalPoint: [0.62, 0.50]
    safeArea: [0.10, 0.12, 0.92, 0.88]
    reason: 현재 AV01의 검은 가림벽과 콘크리트 통로는 1536x1024와 승인 checksum은 정확하지만, 호출 시점이 다른 두 지침 대상을 보이지 않고 다른 architecture-validation 이미지와 같은 빈 건축 경계로 읽혀 교체한다.
    candidateRounds:
      - [TR01, TR02]
      - [TR03, TR04]

