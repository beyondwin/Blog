    action: 서로 다른 재료 면을 검은 프레임으로 겹쳐 비교한다.
    subject: 테라코타와 종이 면 위의 검은 사각 재료 프레임
    cameraDistance: medium
    focalPoint: [0.51, 0.55]
    safeArea: [0.14, 0.10, 0.86, 0.90]
    reason: 초기 replace 대상이었지만 실제 DS01 원본과 sha256:c1c191e5481bd8c7a2b82e5e0dd8109a5520bee12aee4e4cec61935364e84a95를 감사한 결과, 재료를 골라 프레이밍하는 행동이 글의 디자인 판단 기준을 정확히 드러내고 다른 디자인 asset과도 피사체가 구별되어 유지한다.

